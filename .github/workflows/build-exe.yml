name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v1.0.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --noconfirm --clean MarkItDownGUI.spec

      - name: Check the VC++ runtime is bundled
        shell: pwsh
        run: |
          $list = pyi-archive_viewer --list dist\MarkItDownGUI.exe | Out-String
          foreach ($dll in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            if ($list -notmatch [regex]::Escape($dll)) { throw "$dll is not bundled" }
            Write-Host "bundled: $dll"
          }

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\MarkItDownGUI.exe -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: GUI test (open the window and convert a file)
        shell: pwsh
        run: |
          $p = Start-Process dist\MarkItDownGUI.exe -ArgumentList "--gui-selftest","gui_selftest.txt" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "GUI test timed out (window hung)" }
          if (Test-Path gui_selftest.txt) { Get-Content gui_selftest.txt } else { Write-Host "no report written" }
          $log = Join-Path $env:LOCALAPPDATA "MarkItDownGUI\error.log"
          if (Test-Path $log) { Write-Host "--- error.log ---"; Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "GUI test failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: MarkItDownGUI
          path: dist/MarkItDownGUI.exe

      - name: Attach to release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MarkItDownGUI.exe
          body_path: RELEASE_NOTES.md

      - name: Create release (manual run with a tag)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: MarkItDown GUI ${{ inputs.release_tag }}
          body_path: RELEASE_NOTES.md
          files: dist/MarkItDownGUI.exe
